name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python build.py
      - run: python package.py
      - uses: actions/upload-artifact@v4
        with: { name: fse-windows, path: fse-*-windows.zip }
      - if: startsWith(github.ref, 'refs/tags/')
        # (a release made by hand first, notes and all: its zip is replaced by this build)
        run: |
          $zip = (Get-Item fse-*-windows.zip).Name
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload "${{ github.ref_name }}" $zip --clobber }
          else { gh release create "${{ github.ref_name }}" $zip --title "${{ github.ref_name }}" --generate-notes }
        env: { GH_TOKEN: "${{ github.token }}" }
