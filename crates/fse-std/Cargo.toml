[package]
name = "fse-std"
version = "0.1.0"
edition = "2021"
description = "fse plugin \"std\": what Lua can't reach in the game: mouse and keys, the game window, clipboard, real time, reading script-output"

[lib]
name = "fse_std"
crate-type = ["cdylib"]

[dependencies]
fse-plugin = { path = "../fse-plugin" }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell"] }
