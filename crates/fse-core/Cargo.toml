[package]
name = "fse-core"
version = "0.15.4"
edition = "2021"
description = "Injected into factorio.exe: resolves engine symbols from factorio.pdb, hooks Lua state setup, hosts native plugins"

[lib]
name = "fse"
crate-type = ["cdylib"]

[dependencies]
fse-engine = { path = "../fse-engine" }
retour = "0.3"
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Memory"] }
