[package]
name = "fse-engine"
version = "0.1.0"
edition = "2021"
description = "What fse knows about a Factorio build, from its factorio.pdb: identity, functions, class layouts; cached per build and checked against what fse and its plugins need"

[lib]
name = "fse_engine"

[[bin]]
name = "fse-pdb"
path = "src/main.rs"

[dependencies]
pdb = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
