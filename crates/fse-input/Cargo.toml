[package]
name = "fse-input"
version = "0.1.0"
edition = "2021"
description = "fse plugin: every player input action (336 kinds) as an event for Lua, and chosen kinds blocked before the game applies them"

[lib]
name = "fse_input"
crate-type = ["cdylib"]

[dependencies]
fse-plugin = { path = "../fse-plugin" }
retour = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
