[package]
name = "fse-fixes"
version = "0.1.0"
edition = "2021"
description = "fse plugin \"fixes\": small in-memory fixes to engine bugs, each found by its bytes and skipped when they differ"

[lib]
name = "fse_fixes"
crate-type = ["cdylib"]

[dependencies]
fse-plugin = { path = "../fse-plugin" }
retour = "0.3"
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }
