[package]
name = "fnative-entityinfo"
version = "0.1.0"
edition = "2021"
description = "fnative plugin \"entityinfo\": mods add their own rows to the game's info panel for the entity under the cursor"

[lib]
name = "fnative_entityinfo"
crate-type = ["cdylib"]

[dependencies]
fnative-plugin = { path = "../fnative-plugin" }
retour = "0.3"
serde_json = "1"
