[package]
name = "fse-profiler"
version = "0.1.0"
edition = "2021"
description = "fse plugin: times engine functions (detours installed at load, counting only while started)"

[lib]
name = "fse_profiler"
crate-type = ["cdylib"]

[dependencies]
fse-plugin = { path = "../fse-plugin" }
retour = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug"] }
