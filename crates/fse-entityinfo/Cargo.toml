[package]
name = "fse-entityinfo"
version = "0.1.0"
edition = "2021"
description = "fse plugin \"entityinfo\": mods add their own rows to the game's info panel for the entity under the cursor"

[lib]
name = "fse_entityinfo"
crate-type = ["cdylib"]

[dependencies]
fse-plugin = { path = "../fse-plugin" }
retour = "0.3"
serde_json = "1"
