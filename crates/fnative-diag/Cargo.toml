[package]
name = "fnative-diag"
version = "0.1.0"
edition = "2021"
description = "fnative plugin \"diag\": logs the message of every engine exception (RuntimeError, DeserialiserException) with its call stack"

[lib]
name = "fnative_diag"
crate-type = ["cdylib"]

[dependencies]
fnative-plugin = { path = "../fnative-plugin" }
retour = "0.3"
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader"] }
