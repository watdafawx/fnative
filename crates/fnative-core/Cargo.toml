[package]
name = "fnative-core"
version = "0.5.0"
edition = "2021"
description = "Injected into factorio.exe: resolves engine symbols from factorio.pdb, hooks Lua state setup, hosts native plugins"

[lib]
name = "fnative"
crate-type = ["cdylib"]

[dependencies]
fnative-engine = { path = "../fnative-engine" }
retour = "0.3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Security", "Win32_System_Diagnostics_Debug"] }
