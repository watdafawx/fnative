[package]
name = "fnative-launcher"
version = "0.1.0"
edition = "2021"
description = "Starts factorio.exe suspended, injects fnative.dll, waits for it to be ready, resumes the game"

[[bin]]
name = "factorio-native"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_JobObjects"] }
